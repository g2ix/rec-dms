# USC server deployment.
# This workstation has no Docker. Local development uses Supabase
# (DATABASE_URL, DIRECT_URL, S3_*) and the Mailpit binary (`pnpm mailpit`).
# Do not publish these ports on the public internet. The Vercel app reaches
# this host through the locked-down tunnel described in the spec.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: recdms
      POSTGRES_PASSWORD: recdms
      POSTGRES_DB: recdms
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recdms -d recdms"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: recdms
      MINIO_ROOT_PASSWORD: recdms-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 recdms recdms-secret; do
          sleep 2
        done
        mc mb --ignore-existing local/recdms-files
    restart: "no"

  gotenberg:
    build: ./docker/gotenberg
    image: rec-dms-gotenberg:8
    ports:
      - "3001:3000"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
