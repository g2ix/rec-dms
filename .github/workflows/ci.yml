name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: recdms
          POSTGRES_PASSWORD: recdms
          POSTGRES_DB: recdms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recdms -d recdms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # e2e/mail.spec.ts sends real SMTP (SMTP_URL below) and reads it back from Mailpit's API.
      mailpit:
        image: axllent/mailpit:v1.33.0
        ports:
          - 1025:1025
          - 8025:8025
    # Test-only values. Storage is s3rver (scripts/s3-local.mjs) with its fixed S3RVER credentials.
    env:
      DATABASE_URL: postgresql://recdms:recdms@localhost:5432/recdms_test
      DIRECT_URL: postgresql://recdms:recdms@localhost:5432/recdms_test
      AUTH_SECRET: ci-secret
      AUTH_URL: http://127.0.0.1:3000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_BUCKET: recdms-files
      S3_ACCESS_KEY: S3RVER
      S3_SECRET_KEY: S3RVER
      S3_REGION: us-east-1
      SMTP_URL: smtp://127.0.0.1:1025
      EMAIL_FROM: REC-DMS <noreply@localhost>
      APP_TIMEZONE: Asia/Manila
      BOOTSTRAP_ADMIN_EMAILS: admin@usc.edu.ph
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # New high or critical advisories in production dependencies fail the build. Accepted
      # exceptions are pnpm.auditConfig.ignoreGhsas in package.json, each explained in docs/SECURITY.md.
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Start local S3 (s3rver)
        run: |
          nohup node scripts/s3-local.mjs 9000 > s3rver.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://127.0.0.1:9000/ && break; sleep 1; done
          cat s3rver.log
      # Vitest and Playwright read .env.test; write it from the job's test-only values.
      - name: Write .env.test
        run: |
          for key in DATABASE_URL DIRECT_URL AUTH_SECRET AUTH_URL S3_ENDPOINT S3_BUCKET S3_ACCESS_KEY S3_SECRET_KEY S3_REGION SMTP_URL EMAIL_FROM APP_TIMEZONE BOOTSTRAP_ADMIN_EMAILS; do
            printf '%s="%s"\n' "$key" "${!key}"
          done > .env.test
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      # Release documents are converted to PDF with LibreOffice (PDF_CONVERTER default), as on a
      # workstation; production uses Gotenberg, which runs the same LibreOffice.
      - name: Install LibreOffice
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-liberation
          soffice --version
      - run: pnpm test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
